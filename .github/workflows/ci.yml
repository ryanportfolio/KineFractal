name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same major as the Dockerfile base image (node:22-slim).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Compares the bundled snapshot with fearlab/bridge/cells.py in the private
      # range repo. The default GITHUB_TOKEN cannot read range, so without a
      # RANGE_READ_TOKEN secret (read access to ryanportfolio/range) the script
      # prints a notice and exits 0 instead of comparing.
      - run: npm run check:snapshot
        env:
          GH_TOKEN: ${{ secrets.RANGE_READ_TOKEN || github.token }}

      - run: node .claude/scripts/sync-codex-skills.mjs --check

      # Snapshot regen script tests (stdlib only; the runner ships Python 3).
      - run: python3 -m unittest scripts/test_regen_fearlab_snapshot.py
