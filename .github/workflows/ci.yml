name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same major as the Dockerfile base image (node:22-slim).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # npm run check:snapshot is not run here: it needs read access to the
      # private range repo, and drift starts on the range side, not in this
      # repo's PRs. Run it locally, where gh is signed in.

      - run: node .claude/scripts/sync-codex-skills.mjs --check

      # Snapshot regen script tests (stdlib only; the runner ships Python 3).
      - run: python3 -m unittest scripts/test_regen_fearlab_snapshot.py
